name: Razvojni paket iz obstojecih rezultatov
run-name: 'Dokumenti iz zagona ${{ inputs.source_run_id }} / ${{ github.actor }}'
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'ID uspesnega rocnega AI/simulacijskega zagona; brez novega AI-klica'
        type: string
        default: '40794650126'
        required: true
      source_kind:
        description: 'Vrsta izvornega artifacta'
        type: choice
        options: [openai, simulated]
        default: openai
        required: true
permissions:
  contents: read
  actions: read
jobs:
  documents:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Preveri izvorni zagon (samo GitHub, brez OpenAI)
        id: source
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_KIND: ${{ inputs.source_kind }}
        with:
          script: |
            const id = process.env.SOURCE_RUN_ID;
            const kind = process.env.SOURCE_KIND;
            if (!/^[1-9][0-9]{0,14}$/.test(id) || !['openai', 'simulated'].includes(kind)) throw new Error('Neveljaven izvor');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
            if (run.conclusion !== 'success' || run.status !== 'completed' || run.head_branch !== 'main' || run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/ai-trial.yml') throw new Error('Izvor mora biti uspesen rocni cikel iz main');
            const name = `${kind}-${id}-${run.run_attempt}`;
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: Number(id)});
            if (!data.artifacts.some(a => a.name === name && !a.expired)) throw new Error('Artifact ne obstaja ali je potekel');
            core.setOutput('artifact_name', name);
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: source-artifact
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Namesti izdelovalnik dokumentov (brez SDK in API-kljuca)
        run: python -m pip install .
      - name: Ustvari razvojni paket iz shranjenega JSON
        run: python -m src.reporting source-artifact/result.json --metadata-dir source-artifact --output-dir packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: razvojni-paket-${{ inputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/*_Razvojni_paket.zip
          retention-days: 7
          if-no-files-found: error
