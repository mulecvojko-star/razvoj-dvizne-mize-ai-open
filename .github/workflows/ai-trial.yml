name: En AI preizkus (rocno)
run-name: 'V01-R01 / ${{ inputs.mode }} / ${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Nacin: simulated je brez API-stroskov'
        type: choice
        options: [simulated, openai]
        default: simulated
        required: true
      model:
        description: 'Model (dostopnost v racunu ni preverjena)'
        type: choice
        options: [gpt-4.1-mini, gpt-4.1-nano, gpt-5.4-mini]
        default: gpt-4.1-mini
        required: true
      max_output_tokens:
        description: 'Najvec izhodnih tokenov na agenta: 256-4000 (ni financna meja)'
        type: number
        default: 1500
        required: true
      max_prompt_bytes:
        description: 'Najvec bajtov poziva na agenta (ni stevilo tokenov)'
        type: choice
        options: ['16000', '32000', '48000']
        default: '48000'
        required: true
      approval:
        description: 'Vnesi ODOBRIM SIMULACIJO V01-R01 ali za placljiv zagon ODOBRIM AI V01-R01'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: synthetic-ai-trial
  cancel-in-progress: false

env:
  TRIAL_MODE: ${{ inputs.mode }}
  TRIAL_MODEL: ${{ inputs.model }}
  TRIAL_MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
  TRIAL_MAX_PROMPT_BYTES: ${{ inputs.max_prompt_bytes }}
  TRIAL_APPROVAL: ${{ inputs.approval }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Preveri odobritev, main, nov zagon in sinteticni vhod (brez kljuca)
        run: python -m src.orchestrator.cloud --preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-artifacts/preflight.json
          retention-days: 7
          if-no-files-found: error

  simulation:
    needs: preflight
    if: inputs.mode == 'simulated'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: En simuliran cikel (brez skrivnosti in SDK)
        run: python -m src.orchestrator.cloud
      - name: Povzetek
        if: always()
        run: test ! -f cloud-artifacts/summary.md || cat cloud-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: simulated-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-artifacts/
          retention-days: 7
          if-no-files-found: warn

  ai:
    needs: preflight
    if: inputs.mode == 'openai' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: ai-trial
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Namesti preverjeno verzijo SDK (brez kljuca)
        run: python -m pip install '.[ai]' 'openai==2.54.0'
      - name: En izrecno odobren AI-cikel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.orchestrator.cloud
      - name: Povzetek
        if: always()
        run: test ! -f cloud-artifacts/summary.md || cat cloud-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-artifacts/
          retention-days: 7
          if-no-files-found: warn
