name: Zakljucni AI preizkus V01 (rocno)
run-name: 'Koncni V01 / ${{ inputs.mode }} / ${{ github.actor }}'
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [simulated, openai]
        default: simulated
        required: true
        description: 'openai je placljiv, zahteva loceno odobritev'
      model:
        type: choice
        options: [gpt-5.4-mini]
        default: gpt-5.4-mini
        required: true
        description: 'Brez samodejne zamenjave modela ob nedostopnosti'
      budget_usd:
        type: number
        default: 3
        required: true
        description: 'Lokalni prag ocene USD >0 in najvec 3; ni ponudnikov financni limit'
      max_input_tokens:
        type: number
        default: 100000
        required: true
        description: 'Konservativna meja vhodnih tokenov; prompt UTF-8 bajti + 2048'
      max_prompt_bytes:
        type: number
        default: 96000
        required: true
        description: 'Meja celotnega poziva, vkljucno s shemo, najvec 96000 bajtov'
      max_output_tokens:
        type: number
        default: 0
        required: true
        description: '0: vloge 3500/3500/4000/4500; sicer 256-6000 za vsako vlogo'
      approval:
        type: string
        required: true
        description: 'ODOBRIM KONCNO SIMULACIJO V01 ali ODOBRIM KONCNI AI V01 DO 16 KLICEV'
permissions:
  contents: read
concurrency:
  group: synthetic-ai-trial
  cancel-in-progress: false
env:
  FINAL_MODE: ${{ inputs.mode }}
  FINAL_MODEL: ${{ inputs.model }}
  FINAL_BUDGET_USD: ${{ inputs.budget_usd }}
  FINAL_MAX_INPUT_TOKENS: ${{ inputs.max_input_tokens }}
  FINAL_MAX_PROMPT_BYTES: ${{ inputs.max_prompt_bytes }}
  FINAL_MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
  FINAL_APPROVAL: ${{ inputs.approval }}
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m src.final_trial --preflight
      - name: Ocena pred klici (brez kljuca)
        if: always()
        run: test ! -f final-artifacts/preflight.json || cat final-artifacts/preflight.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: final-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: final-artifacts/
          retention-days: 7
          if-no-files-found: warn
  simulation:
    needs: preflight
    if: inputs.mode == 'simulated'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m src.final_trial
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: final-simulated-${{ github.run_id }}-${{ github.run_attempt }}
          path: final-artifacts/
          retention-days: 7
          if-no-files-found: warn
  ai:
    needs: preflight
    if: inputs.mode == 'openai' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: ai-trial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[ai]' 'openai==2.54.0'
      - name: Loceno odobren placljivi preizkus (najvec 16, brez ponovitev)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.final_trial
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: final-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: final-artifacts/
          retention-days: 7
          if-no-files-found: warn
