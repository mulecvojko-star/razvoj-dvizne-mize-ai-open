name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional API adapter for offline contract tests
        run: python -m pip install ".[ai]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic example
        run: python -m src.orchestrator examples/V01-R01.json --approve-cycle V01-R01
