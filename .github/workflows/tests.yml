name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional API adapter for offline contract tests
        run: python -m pip install ".[ai,test]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic example
        run: python -m src.orchestrator examples/V01-R01.json --approve-cycle V01-R01
      - name: Export synthetic development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-package-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: .runs/packages/*_Razvojni_paket.zip
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Simulate two bounded revisions without model calls
        run: python -m src.orchestrator.revisions examples/V01-R01.json --approve-sequence V01:R01-R02 --output-dir revision-artifacts
      - name: Export revision development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revision-cycle-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: revision-artifacts/V01_R01-R02_Razvojni_cikel.zip
          retention-days: 7
          if-no-files-found: error
