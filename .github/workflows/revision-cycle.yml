name: Dve reviziji V01 (samo simulacija)
run-name: 'Simulirani reviziji V01 / ${{ github.actor }}'
on:
  workflow_dispatch:
    inputs:
      max_revisions:
        description: 'Najvec revizij; za paket R01-R02 izberi 2'
        type: choice
        options: ['2', '1']
        default: '2'
        required: true
      approval:
        description: 'Vnesi V01:R01-R02 (ali V01:R01-R01 za eno revizijo); samo simulacija'
        type: string
        required: true
permissions:
  contents: read
jobs:
  simulation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Namesti dokumente in deterministicni izvajalnik (brez SDK in kljuca)
        run: python -m pip install .
      - name: Odobreno omejeno zaporedje brez API-klicev
        env:
          REVISION_APPROVAL: ${{ inputs.approval }}
          REVISION_MAX_REVISIONS: ${{ inputs.max_revisions }}
        run: python -m src.orchestrator.revisions examples/V01-R01.json --approve-sequence "$REVISION_APPROVAL" --max-revisions "$REVISION_MAX_REVISIONS" --output-dir revision-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: revizije-V01-${{ github.run_id }}-${{ github.run_attempt }}
          path: revision-artifacts/
          retention-days: 7
          if-no-files-found: warn
